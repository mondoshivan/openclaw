services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_DOCKER_APT_PACKAGES: ffmpeg nano jq
    image: docker-registry.home-intra.net/openclaw/gateway:latest
    ports: !reset []
    dns:
      - 192.168.178.84
      - 192.168.178.1
    environment:
      - PATH=/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      - home-server
    volumes: !override
      - openclaw-home:/home/node # used for persisting the entire home dir
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z # used for persisting config files, logs, and other important data
    security_opt:
      - label=disable

  openclaw-cli:
    volumes: !override
      - openclaw-home:/home/node # used for persisting the entire home dir
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z # used for persisting config files, logs, and other important data
volumes:
  openclaw-home:
    name: ${OPENCLAW_HOME_VOLUME:-openclaw-home}

networks:
  home-server:
    external: true
    name: home-server_home-server
