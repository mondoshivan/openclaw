services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_DOCKER_APT_PACKAGES: ffmpeg nano jq python3-pip python3-venv cmake git-lfs ripgrep less
    image: docker-registry.home-intra.net/openclaw/gateway:latest
    ports: !reset []
    dns:
      - 192.168.178.84
      - 192.168.178.1
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TELEGRAM_FINTECH_TOKEN=${TELEGRAM_FINTECH_TOKEN}
      - TELEGRAM_PERSONAL_TOKEN=${TELEGRAM_PERSONAL_TOKEN}
      - TELEGRAM_CODER_TOKEN=${TELEGRAM_CODER_TOKEN}
      - XAI_API_KEY=${XAI_API_KEY}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - PATH=/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      - home-server
    volumes: !override
      - openclaw-home:/home/node # used for persisting the entire home dir
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z # used for persisting config files, logs, and other important data
    security_opt:
      - label=disable

  openclaw-cli:
    volumes: !override
      - openclaw-home:/home/node # used for persisting the entire home dir
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z # used for persisting config files, logs, and other important data
volumes:
  openclaw-home:
    name: ${OPENCLAW_HOME_VOLUME:-openclaw-home}

networks:
  home-server:
    external: true
    name: home-server_home-server
