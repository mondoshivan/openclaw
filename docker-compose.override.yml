services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway-sandbox
      args:
        BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: docker-registry.home-intra.net/openclaw/gateway:latest
    ports: !reset []
    networks:
      - home-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace:z
    group_add:
      - "${DOCKER_GID:-999}"

  openclaw-cli:
    networks:
      - home-server
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw:z
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace:z

networks:
  home-server:
    external: true
    name: home-server_home-server
